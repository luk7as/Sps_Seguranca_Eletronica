<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contato — SPS Soluções Residenciais</title>
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <div class="container nav">
      <div class="brand">
        <div class="logo">SPS</div>
        <div>
          <div class="brand-title">SPS Soluções Residenciais</div>
          <div class="brand-subtitle">Sidinei — Curitiba e RM</div>
        </div>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h1>Contato</h1>
      <p class="lead">Entre em contato para um orçamento sem compromisso.</p>
      <form action="#" onsubmit="return enviarFormulario(event)">
        <div class="row">
          <input type="text" name="nome" placeholder="Seu nome" required />
          <input type="tel" name="telefone" placeholder="Telefone" required />
        </div>
        <input type="email" name="email" placeholder="E-mail (opcional)" />
        <textarea name="mensagem" rows="4" placeholder="Descreva o serviço desejado" required></textarea>
        <div class="form-actions">
          <button class="submit" type="submit">Enviar mensagem</button>
          <a class="btn btn-outline" href="tel:+5541991961445">Ligar agora</a>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <div class="container footer">
      <div>© SPS Soluções Residenciais — Sidinei</div>
      <div>Telefone: <a href="tel:+5541991961445">(41) 99196-1445</a></div>
      <div>instagram: <a href="https://www.instagram.com/sps_segurancaeletronica/"> sps_segurancaeletronica</a></div>
    </div>
  </footer>
</body>
</html>
